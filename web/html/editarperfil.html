<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../css/editarperfil.css">
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <title>Ronrom</title>
</head>
<body> 
    <header class="principal">
        <div class="voltar">
            <img src="../assets/voltar_botao.png">
            <a href="userconfig.html">Voltar</a>
        </div>

        <main id="bloco_editar">
            <h1>Editar Perfil</h1>

            <div id="foto">
                <div id="foto_legenda">
                    <img src="../assets/user_foto.png">
                    Icone de Usuário:
                </div>
                <div id="fotos">
                    <img src="../assets/user-ft-1.png">
                    <img src="../assets/user-ft-2.png">
                    <img src="../assets/user-ft-3.png">
                    <img src="../assets/user-ft-4.png">
                    <img src="../assets/user-ft-5.png">
                    <img src="../assets/user-ft-6.png">
                </div>
            </div>

            <div id="username">
                <label for="username_input">Nome de usuário</label>
                <input type="text" id="username_input" maxlength="30">
            </div>

            <div id="email">
                <label for="email_input">E-mail</label>
                <input type="text" id="email_input" maxlength="50">
            </div>

            <div id="senha">
                <label>Senha</label>
                <input type="password" id="email_input" maxlength="50">
            </div>

            <button id="salvar">
                Salvar
            </button>
        </main>

        <footer id="rodape">
            
        </footer>

    </header>

    <script src="../js/editarperfil.js"></script>
</body>
</html>
