<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../css/gato.css">
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <title>Ronrom</title>
</head>
<body>

    <div class="voltar">
            <img src="../assets/voltar_botaob.png">
            <a href="index.html">Voltar</a>
    </div>

    <main class="principal">
        <div id="foto">
            <img src="../assets/exemplos-gatos/" id="fotog">
        </div>

        <div id="info">
            <h1 id="nome"></h1>
            <p><strong>Comportamento: </strong><span id="comportamento"></span>.</p>
            <p><strong>Histórico: </strong><span id="historico"></span></p>
            <div id="info_boolean">
                <p id="castrado"></p>
                <p id="vacinado"></p>
                <p id="vermifulgado"></p>
                <p id="fiv"></p>
                <p id="felv"></p>
                <p id="deficiente"></p>
            </div>
            <div id="info_principal">
                <p><strong>Idade: </strong><span id="idade"></span></p>
                <p><strong>Sexo: </strong><span id="sexo"></span></p>
                <p><strong>Cor/Raça: </strong><span id="cor"></span></p>
                <p><strong>Peso: </strong><span id="peso"></span>KG</p>
            </div>
            <button id="adotar_btn">Adotar!</button>
        </div>
    </main>

    <script src="../js/gato.js"></script>
</body>
</html>
